name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks pages and validates every content file against the schema
      # (e.g. a rating above 5 fails here).
      - run: npm run check
      - run: npm run build
      # Every theme in the picker must meet WCAG contrast after the guard.
      - run: node scripts/contrast-audit.mjs
